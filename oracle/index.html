<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081327">
<meta name="description" content="鏡花ママのオラクルカード。毎日一枚、今日の自分に向き合う言葉を受け取る。">
<title>鏡花ママのオラクルカード</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23081327'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23ddbd7e' stroke-width='2'/%3E%3Cpath d='M32 13v38M13 32h38M23 23l18 18M41 23 23 41' stroke='%23ddbd7e' stroke-width='1'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23f4e9d0'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#081327;--gold:#dabb83;--pale:#f5e7c8;--text:#f5f0e8;--muted:#b9c2d0}
*{box-sizing:border-box}html{min-height:100%;background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 25%,#1f3762,#0b1931 43%,#081327 78%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(circle at 14% 17%,#f2deae 0 1px,transparent 2px),radial-gradient(circle at 76% 24%,#f2deae 0 1px,transparent 2px),radial-gradient(circle at 87% 70%,#f2deae 0 1px,transparent 2px),radial-gradient(circle at 23% 78%,#f2deae 0 1px,transparent 2px)}
.shell{position:relative;width:min(100%,780px);margin:auto;padding:28px 20px max(44px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #cfb67b4d;padding:0 0 18px}
.brand{color:var(--pale);letter-spacing:.1em;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:16px}.day{font-size:12px;color:var(--muted);white-space:nowrap}
main{text-align:center}.eyebrow{margin:48px 0 12px;color:var(--gold);letter-spacing:.25em;font-size:11px}
h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(29px,6vw,44px);font-weight:500;letter-spacing:.08em;line-height:1.45}
.intro{margin:15px auto 26px;line-height:1.85;color:#d9deea;font-size:14px}
.deck{width:min(58vw,230px);aspect-ratio:957/1643;margin:30px auto;position:relative;border:1px solid #cfb67b;border-radius:12px;background:radial-gradient(circle at 50% 48%,#42547d,#19294a 24%,#071126 72%);box-shadow:0 0 0 5px #071126,0 0 0 6px #b49a65,0 22px 55px #0009;display:grid;place-items:center}
.deck:before{content:"";position:absolute;inset:11px;border:1px solid #b79b64aa;border-radius:6px}.deck:after{content:"";position:absolute;inset:20px;border:1px solid #b79b644d;border-radius:50%;transform:scale(.65,1)}
.sigil{font-size:72px;line-height:1;color:var(--pale);text-shadow:0 0 28px #f4d7a8;font-family:serif;z-index:1;font-weight:200}.tiny{position:absolute;z-index:1;bottom:14%;color:var(--gold);font-family:serif;letter-spacing:.3em;font-size:10px}
button{appearance:none;border:1px solid #d7bd87;border-radius:100px;background:linear-gradient(145deg,#efd9ad,#b5965d);color:#10192a;padding:15px 34px;font-size:15px;font-weight:700;letter-spacing:.07em;cursor:pointer;min-height:52px;box-shadow:0 10px 28px #0006}
button:hover{filter:brightness(1.08)}button:focus-visible{outline:3px solid white;outline-offset:4px}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin:18px 0 0}
.result{display:none;max-width:620px;margin:36px auto 0}.result.visible{display:block;animation:appear .55s ease both}
.card-image{display:block;width:min(76vw,315px);height:auto;margin:0 auto;border-radius:8px;box-shadow:0 22px 60px #000a}
.result-copy{text-align:left;margin:28px auto 0;padding:26px clamp(20px,5vw,42px);background:linear-gradient(160deg,#152744ed,#0e1c34f2);border:1px solid #bd9f6c80;border-radius:14px;box-shadow:0 15px 40px #0004}
.result-label{font-size:11px;color:var(--gold);letter-spacing:.18em}.result-title{margin:8px 0 18px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:29px;font-weight:500;color:var(--pale)}
.short{margin:0 0 20px;color:#fff4de;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(20px,5vw,25px);line-height:1.8;white-space:pre-line}.rule{width:40px;height:1px;background:var(--gold);margin:0 0 20px}
.body{margin:0;line-height:2.05;font-size:14px;color:#e3e7ef;white-space:pre-line}.after{font-size:12px;color:var(--muted);line-height:1.8;margin:22px auto 0}
footer{text-align:center;color:#aebbd0;font-size:11px;line-height:1.8;padding-top:48px}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.result.visible{animation:none}}
@media(max-width:440px){.shell{padding:20px 16px 42px}.eyebrow{margin-top:38px}.deck{margin-top:24px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">鏡花ママのオラクルカード</div><time class="day" id="day"></time></header>
<main>
<section id="opening" aria-labelledby="page-title">
<p class="eyebrow">TODAY'S ORACLE</p>
<h1 id="page-title">今日の一枚を、引く。</h1>
<p class="intro">少しだけ立ち止まって、いまの自分に目を向ける時間。</p>
<div class="deck" aria-hidden="true"><span class="sigil">✧</span><span class="tiny">KYOKA ORACLE</span></div>
<button id="draw" type="button">今日のカードを引く</button>
<p class="hint" id="draw-hint">一日一枚。今日引いたカードは、あとから見返せます。</p>
</section>
<section class="result" id="result" aria-labelledby="result-title">
<img class="card-image" id="card-image" alt="">
<div class="result-copy">
<span class="result-label">今日のカード <span id="number"></span> / 22</span>
<h2 class="result-title" id="result-title"></h2>
<p class="short" id="short"></p>
<div class="rule" aria-hidden="true"></div>
<p class="body" id="body"></p>
</div>
<p class="after">この一枚は、今日の自分に問いかけるための言葉です。<br>明日になったら、また新しい一枚を引けます。</p>
</section>
</main>
<footer>鏡花ママのオラクルカード</footer>
</div>
<script>
const cards=[{"id":"01","title":"本音の鏡","image":"カード画像/01_本音の鏡.jpg","short":"ほんまは、どう思てる\n人に見せる前の方や","body":"人に話す用の答えと\n自分だけが知ってる答えは、だいたい違う\n今日は、後の方を先に見といて\n口に出さんでもええ\n出さんでも、自分が知ってるかどうかで\n返事の速さが変わるからな"},{"id":"02","title":"言葉と行動","image":"カード画像/02_言葉と行動.jpg","short":"言うたことやのうて\nやったことを数えてみ","body":"人は、言葉では何とでも言える\nやから、言うた回数は数えんでええ\n送ってきた時間\n来た日と、来んかった日\nそういう、後から数えられるもんだけ見といて\n気持ちは測られへんけど、行動は残る"},{"id":"03","title":"違和感","image":"カード画像/03_違和感.jpg","short":"その引っかかり、消さんでええ\nまだ理由が付いてへんだけや","body":"何か変やな、と思た時\nたいていの人は、すぐ理由を作って片づけてまう\n疲れてるだけ、気のせい、そんなとこや\nけど引っかかりは、理由より先に来る\n先に来た方が、当たってることが多い\n今日は消さずに、一回だけ覚えといて"},{"id":"04","title":"沈黙","image":"カード画像/04_沈黙.jpg","short":"黙ってる時間に\n出てるもんがある","body":"話が途切れた時\n気まずいと思て埋めにいくんは、いつもあんたの方か\nそれとも相手か\n埋める側が決まってるんやったら\nその関係の形は、もう出てる\n今日は一回だけ、埋めずに置いてみ"},{"id":"05","title":"信頼","image":"カード画像/05_信頼.jpg","short":"一回の言葉やのうて\n重なった回数で決まる","body":"信じてええかどうかは\nその人が何を言うたかでは決まらん\n同じことを、何回やったかや\n一回やったら偶然\n三回続いたら、それがその人のやり方になる\n今日は、三回目があったかどうかを思い出してみ"},{"id":"06","title":"境界","image":"カード画像/06_境界.jpg","short":"線は引いてええ\n引いても、嫌いにはならん","body":"大事にすることと、合わせ続けることは別もんや\nここから先は入ってこんといて、という線は\n関係を切るための線やない\n長いこと続けるための線や\n今日、どこに引くかを一つだけ決めてみ"},{"id":"07","title":"余白","image":"カード画像/07_余白.jpg","short":"埋まってへん時間に\n答えが出てくる","body":"予定で一日を埋めてる間は\n考えてるようで、何も決まってへんことが多い\n何もせん時間を怖がる人ほど\n決めなあかんことを後ろに置いてる\n今日は十分でええ\n何も入れんと座ってみ"},{"id":"08","title":"休息","image":"カード画像/08_休息.jpg","short":"しんどいのは\n気の持ちようやない","body":"ようやった日ほど、自分には厳しい\nもっとできた、と言い出す\nけどな、体が重い日は、判断も重なって鈍る\nそういう日に人のことを決めたら、たいてい外す\n今日は決めんでええ\n決めんのも、ひとつの選び方や"},{"id":"09","title":"手放す","image":"カード画像/09_手放す.jpg","short":"置いてええもんが\n一つだけある","body":"全部を手放す話やない\n抱えてるうちの一つだけや\n役目が終わってるのに、まだ持ってるもん\nやらなあかんと思てるだけで\n誰にも頼まれてへんこと\n思い当たるんやったら、今日はそれを下ろしてみ"},{"id":"10","title":"孤独","image":"カード画像/10_孤独.jpg","short":"ひとりの時にだけ\n見えるもんがある","body":"人といる時のあんたは\n相手に合わせて少しずつ形を変えてる\n悪いことやない、誰でもそうや\nやから、ひとりの時の気持ちが\nいちばん元の形に近い\n寂しいと思たら、何が足りんのかまで見といて"},{"id":"11","title":"約束","image":"カード画像/11_約束.jpg","short":"守られた約束と\n流れた約束を、並べてみ","body":"約束は、守るか破るかの二つやない\nいちばん多いんは、うやむやになるやつや\n言い出した方が忘れて、こっちだけ覚えてる\n今日は、覚えてる側がどっちかを見といて\nいつも同じ側やったら\nその約束は、片方にしか効いてへん"},{"id":"12","title":"対等","image":"カード画像/12_対等.jpg","short":"どっちかだけが\n気ぃ遣うてへんか","body":"釣り合いは、金や立場では決まらん\n謝る回数\n予定を合わせる側\n話を切り上げる側\nそういう細かいとこが、片方に寄ってたら\nそれが今の形や\n直す前に、まず数えてみ"},{"id":"13","title":"伝える","image":"カード画像/13_伝える.jpg","short":"分かってもらうんを\n待たんでええ","body":"察してくれる人は、たまにおる\nおるけど、あてにして待つと\nだいたい、待った分だけしんどなる\n短い一言でええ\nうまいこと言おうとせんでええ\n言うてへんことは、伝わってへんだけやからな"},{"id":"14","title":"選ぶ縁","image":"カード画像/14_選ぶ縁.jpg","short":"全部つなぎ止めんでええ","body":"縁は、切るか続けるかやない\nどれを手入れするか、や\n人に使える時間は決まってるから\n全部に同じだけ配ったら、全部が薄なる\n今日は、濃い方に置きたい人を一人だけ決めてみ\n残りは、そのままでええ"},{"id":"15","title":"暮らし","image":"カード画像/15_暮らし.jpg","short":"気持ちより先に\n部屋とごはんを戻す","body":"人のことで頭がいっぱいの時はな\nたいてい、寝る時間と食べるもんが先に崩れてる\n気持ちを立て直そうとしても、そこが崩れてたら戻らん\n順番が逆やねん\n今日は、布団に入る時間だけ決めとき"},{"id":"16","title":"待つ時間","image":"カード画像/16_待つ時間.jpg","short":"待ってる間に\n何をしてるかの方や","body":"返事を待つんは、しんどい\nけどしんどいんは、待つことやのうて\n待ってる間、他のことが手につかんことや\n何分おきに見てるか\n一回だけ数えてみ\n数えたら、だいたい自分で止まる"},{"id":"17","title":"岐路","image":"カード画像/17_岐路.jpg","short":"どっちか選ぶ前に\n選べる手が何本あるか","body":"行くか、やめるか\nその二つに見えてる時はな\nたいてい、まだ他の道を探してへんだけや\n今のまま置いとく、も一つ\n期限を決めて待つ、も一つ\n二択やなくなったら、急に軽なることがある"},{"id":"18","title":"変化","image":"カード画像/18_変化.jpg","short":"変わりかけは\nたいてい、しんどい","body":"前のやり方が合わんようになってきた時\n人は、自分がおかしなったと思う\nちゃうねん\n合わんようになったんは、合う形が変わったからや\n今はその途中やから、落ち着かん\n落ち着かんままで、しばらくええ"},{"id":"19","title":"再生","image":"カード画像/19_再生.jpg","short":"終わったもんを\nもう一回ひっくり返さんでええ","body":"あの時ああしてたら、を何回やっても\n出てくる答えは同じや\nもう知ってることやからな\nそれより、あの時に覚えたことを\n次にどこで使うか\nそっちを一つ決めるだけで、だいぶ違う"},{"id":"20","title":"一歩","image":"カード画像/20_一歩.jpg","short":"大きいこと決めんでええ\n今日できる一つだけ","body":"全部ひっくり返す計画を立てた日ほど\n次の日に何もせえへん\n重いもんは、持ち上がらんからな\n連絡を一本返す\nそのくらいでええ\n一歩目が軽い時だけ、二歩目が出る"},{"id":"21","title":"自分の光","image":"カード画像/21_自分の光.jpg","short":"人に言われんかった長所が\nたいてい本物や","body":"褒められて嬉しかったことやのうて\n自分では当たり前すぎて、言われたこともないこと\n人の変化によう気づく\n怒らせんように先回りできる\nそういうやつや\n使いすぎてすり減ることもあるから\n今日は、どこで使うか選んでみ"},{"id":"22","title":"夜明け","image":"カード画像/22_夜明け.jpg","short":"楽になるんは\n気づいた後からやない","body":"分かった日から、すぐ変わるもんでもない\nしばらくは、分かったのに動けん時期が続く\nそこで戻ってまう人が多いけど\nその時期があるんが普通やねん\n今日のところは、戻ってへんかどうかだけ\n見といたらええ"}];
const storageKey='kyoka-oracle-daily-v1';
const today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let currentDate=today();
document.getElementById('day').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
const readSaved=()=>{try{const item=JSON.parse(localStorage.getItem(storageKey)||'null');return item&&Number.isInteger(item.index)&&item.index>=0&&item.index<cards.length?item:null}catch{return null}};
const save=item=>{try{localStorage.setItem(storageKey,JSON.stringify(item))}catch{}};
const randomIndex=()=>{if(globalThis.crypto&&crypto.getRandomValues){const v=new Uint32Array(1);crypto.getRandomValues(v);return v[0]%cards.length}return Math.floor(Math.random()*cards.length)};
const showCard=index=>{const card=cards[index];document.getElementById('card-image').src=encodeURI(card.image);document.getElementById('card-image').alt=card.title+' のカード';document.getElementById('number').textContent=card.id;document.getElementById('result-title').textContent=card.title;document.getElementById('short').textContent=card.short;document.getElementById('body').textContent=card.body;document.getElementById('opening').hidden=true;document.getElementById('result').classList.add('visible');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})};
const saved=readSaved();if(saved&&saved.date===currentDate){document.getElementById('draw').textContent='今日のカードを見る';document.getElementById('draw-hint').textContent='今日のカードは、いつでも見返せます。'}
document.getElementById('draw').addEventListener('click',()=>{const now=today();const existing=readSaved();let index;if(existing&&existing.date===now){index=existing.index}else{index=randomIndex();if(existing&&cards.length>1&&index===existing.index)index=(index+1)%cards.length;save({date:now,index})}currentDate=now;showCard(index)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==currentDate)location.reload()});
</script>
</body>
</html>
